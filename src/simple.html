<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
<title>BGH LIVE Simple mode</title>
<link rel="stylesheet" href="vendor/fonts/inter/400.css"><link rel="stylesheet" href="vendor/fonts/inter/500.css"><link rel="stylesheet" href="vendor/fonts/inter/600.css">
<link rel="stylesheet" href="vendor/fonts/inter/700.css"><link rel="stylesheet" href="vendor/fonts/inter/800.css"><link rel="stylesheet" href="vendor/fonts/spectral/700.css">
<!-- BGH LIVE Controller: Simple mode, the second window that fills the touchscreen (simple.js).
     It has no connection to OBS: the controller on the main monitor sends what's happening, and runs every tap
     through its own functions, so the rules are the same as on the controller and the phone remote. -->
<style>
/* Layout: a 1920×1080 screen ("Big tiles"), scaled to fit the touchscreen. Top bar · Program picture, mic and
   notices on the left · scene tiles and the on-screen buttons on the right. Dark, like the controller. */
:root{
  --bg:#0c0f13; --panel:#141920; --panel-2:#1b222b; --line:#29323d; --line-2:#36414e;
  --fg:#e7ecf2; --muted:#8a96a6; --dim:#5d6876;
  --accent:#3b8cff; --accent-soft:rgba(59,140,255,.16);
  --pgm:#e5484d; --pgm-ink:#ff8a8d; --pgm-soft:rgba(229,72,77,.16);
  --ok:#2fbf71; --ok-soft:rgba(47,191,113,.12);
  --warn:#f5a524; --warn-soft:rgba(245,165,36,.14); --brand:#F5B700; --brand-ink:#12213d;
  --f-ui:"Inter","Segoe UI",system-ui,sans-serif;
  --f-brand:"Spectral",Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
svg.i{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fit{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.frame{position:relative;flex:none}
.stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;box-sizing:border-box;padding:24px 32px 32px;display:flex;flex-direction:column;gap:24px;background:var(--bg);overflow:hidden}

/* top bar */
.top{display:flex;align-items:center;gap:16px;height:72px;flex:none}
.logo{display:flex;align-items:center;gap:14px;min-width:0}
.logo .badge{width:56px;height:56px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.logo b{font-family:var(--f-brand);font-size:34px;letter-spacing:.04em}
.coll{font-size:20px;color:var(--muted);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.coll.bad{color:var(--warn)}
.grow{flex:1}
.safeBtn{display:flex;align-items:center;justify-content:center;height:64px;width:64px;padding:0;box-sizing:border-box;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--muted)}
.safeBtn svg{width:28px;height:28px}
.safeBtn[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.out{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px;border-radius:999px;border:2px solid var(--line-2);background:var(--panel-2);font-weight:800;font-size:21px;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.out .dot{width:12px;height:12px;border-radius:50%;background:var(--dim)}
.out .cap{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;font-size:16px;letter-spacing:.06em}
.out .cap svg{width:14px;height:14px}
.out.live{padding-right:10px;border-color:var(--pgm);background:var(--pgm);color:#fff}
.out.live .dot{background:#fff;animation:blink 1.4s infinite}
.out.live .cap{background:rgba(0,0,0,.25)}
.out.rec{padding-right:10px;border-color:var(--pgm);background:transparent;color:var(--pgm-ink)}
.out.rec .dot{background:var(--pgm);animation:blink 1.4s infinite}
.out.rec .cap{background:var(--pgm-soft)}
.out.go{border-color:var(--pgm);color:var(--pgm-ink)}
.out.go .dot{background:var(--pgm)}
.out.wait{border-color:var(--warn);color:var(--warn)}
.out.wait .dot{background:var(--warn);animation:blink 1s infinite}
.out.remind{border-color:var(--warn);color:var(--warn)}
@keyframes blink{50%{opacity:.3}}
.menuBtn{display:flex;align-items:center;gap:12px;height:64px;padding:0 26px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);font-size:22px;font-weight:600}
.menuBtn[aria-expanded="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.menu{position:absolute;top:104px;right:32px;width:480px;box-sizing:border-box;padding:12px;border-radius:18px;border:1px solid var(--line-2);background:var(--panel);box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:4px;z-index:20}
.menu button{display:flex;align-items:center;gap:16px;height:72px;padding:0 18px;border-radius:12px;border:none;background:transparent;font-size:22px;font-weight:600;text-align:left}
.menu button:active{background:var(--panel-2)}
.menu button span{margin-left:auto;font-size:18px;color:var(--muted);font-weight:500;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu hr{border:none;height:1px;background:var(--line);margin:4px 6px}

/* body */
.main{flex:1;display:flex;gap:32px;min-height:0}
.left{width:1100px;display:flex;flex-direction:column;gap:20px;flex:none;min-height:0}
.mon{position:relative;width:1100px;height:619px;border-radius:16px;border:3px solid var(--pgm);overflow:hidden;background:#000;flex:none;box-sizing:border-box}
.mon img{display:block;width:100%;height:100%;object-fit:contain}
.mon .tag{position:absolute;top:16px;left:16px;padding:6px 14px;border-radius:8px;background:var(--pgm);color:#fff;font-weight:800;font-size:18px;letter-spacing:.08em;max-width:900px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;font-weight:600}
.mic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;height:72px;padding:0 24px;border-radius:14px;border:2px solid var(--ok);background:var(--ok-soft);text-align:left;flex:none}
.mic svg{width:30px;height:30px;color:var(--ok)}
.mic .meter{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.mic .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok) 70%,var(--warn) 88%,var(--pgm));transition:width 90ms linear}
.mic b{font-size:22px;letter-spacing:.06em}
.mic[aria-pressed="true"]{border-color:var(--pgm);background:var(--pgm-soft)}
.mic[aria-pressed="true"] svg,.mic[aria-pressed="true"] b{color:var(--pgm-ink)}
.mic:disabled{border-color:var(--line-2);background:var(--panel)}
.mic:disabled svg,.mic:disabled b{color:var(--muted)}
.notes{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.bn{display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 20px;box-sizing:border-box;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);font-size:20px;line-height:1.35}
.bn svg{width:28px;height:28px;color:var(--muted)}
.bn b{color:var(--fg)}
.bn .t{flex:1;min-width:0;color:var(--muted)}
.bn.bad{border-color:var(--pgm);background:var(--pgm-soft)}
.bn.bad svg{color:var(--pgm-ink)}
.bn.warn{border-color:var(--warn);background:var(--warn-soft)}
.bn.warn svg{color:var(--warn)}
.bn .btn{height:56px;padding:0 22px;font-size:20px;flex:none}
.ssbar{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:12px;height:88px;flex:none}
.ssbar .btn{height:auto}
.ssbar .mid{display:flex;align-items:center;gap:16px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);min-width:0}
.ssbar .mid img{height:64px;border-radius:6px}
.ssbar .mid b{font-size:22px;white-space:nowrap}
.ssbar .mid span{font-size:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.right{flex:1;display:flex;flex-direction:column;gap:20px;min-width:0}
.tiles{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;min-height:0}
.tile{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 64px 0 28px;border-radius:18px;border:2px solid var(--line-2);background:var(--panel-2);text-align:left;font-size:32px;font-weight:700;position:relative;min-width:0;overflow:hidden}
.tile .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:18px;font-weight:500;color:var(--muted)}
.tile .mi{position:absolute;top:18px;right:20px;width:26px;height:26px;color:var(--dim)}
.tile .mi.off{color:var(--pgm)}
.tile[aria-pressed="true"]{border:3px solid var(--pgm);background:var(--pgm-soft);color:#fff;font-weight:800}
.tile[aria-pressed="true"] small{color:var(--pgm-ink);font-weight:700;letter-spacing:.04em}
.tile.pending{border-color:var(--warn)}
.nowbar{display:flex;align-items:center;gap:14px;padding:0 4px;font-size:20px;color:var(--muted);min-height:30px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar b{color:var(--fg)}
.nowbar .up{padding:3px 10px;border-radius:6px;background:var(--pgm);color:#fff;font-weight:800;font-size:15px;letter-spacing:.08em}
.nowbar .up.off{background:var(--panel-2);color:var(--muted)}
.ons{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:16px;height:96px;flex:none}
.ons button{display:flex;align-items:center;justify-content:center;gap:12px;border-radius:16px;border:1px solid var(--line-2);background:var(--panel);font-size:26px;font-weight:700}
.ons .next{background:var(--accent);border-color:var(--accent);color:#fff;font-size:30px}
.ons .done{color:var(--pgm-ink);border-color:var(--pgm)}
.ons .off{grid-column:1/-1;font-size:20px;color:var(--muted);display:flex;align-items:center;padding:0 20px;border:1px dashed var(--line-2);border-radius:16px}

/* sheets and the confirm dialog */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30}
.sheet{width:860px;max-height:1000px;box-sizing:border-box;padding:32px;border-radius:24px;background:var(--panel);border:1px solid var(--line-2);display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheet.wide{width:1400px}
.sheet h2{margin:0;font-size:34px;text-wrap:balance}
.sheet p{margin:0;font-size:22px;color:var(--muted);line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{height:84px;border-radius:16px;border:1px solid var(--line-2);background:var(--panel-2);font-size:24px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--pgm);border-color:var(--pgm);color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.keys button{height:84px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.num{height:90px;border-radius:14px;border:1px solid var(--line-2);background:var(--bg);display:flex;align-items:center;padding:0 24px;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.num span{font-size:22px;font-weight:600;color:var(--muted);margin-left:20px;overflow:hidden;text-overflow:ellipsis}
.num span.err{color:var(--pgm-ink)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chips button{min-height:76px;padding:8px 26px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);font-size:24px;font-weight:700}
.chips button small{display:block;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.chips button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.chips button.up{border:2px solid var(--pgm);background:var(--pgm-soft)}
.chips button.seen{color:var(--muted)}
.chips.scroll{max-height:560px;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;border-radius:14px;background:var(--bg);border:1px solid var(--line-2)}
.seg button{height:64px;border-radius:10px;border:none;background:transparent;font-size:22px;font-weight:700}
.seg button[aria-selected="true"]{background:var(--accent);color:#fff}
.grid{display:grid;gap:10px;max-height:520px;overflow:auto}
.grid.books{grid-template-columns:repeat(7,minmax(0,1fr))}
.grid.nums{grid-template-columns:repeat(10,minmax(0,1fr))}
.grid button{height:72px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);font-size:22px;font-weight:700}
.pickh{display:flex;align-items:center;gap:18px;font-size:24px}
.pickh .link{height:56px;padding:0 18px 0 8px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700}
.pickh span{color:var(--muted);font-size:20px}
.reading{display:flex;align-items:center;gap:16px;height:84px;padding:0 24px;border-radius:16px;border:none;background:var(--accent);color:#fff;font-size:24px;font-weight:700;text-align:left}
.reading small{display:block;font-size:16px;font-weight:600;opacity:.85}
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);padding:16px 28px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:22px;z-index:40;max-width:1400px;text-align:center}
</style>
</head>
<body>
<div class="fit" id="fit"><div class="frame" id="frame"><div class="stage" id="stage">

  <header class="top">
    <div class="logo"><div class="badge">LIVE</div><b>BGH</b><span class="coll" id="coll">Connecting…</span></div>
    <div class="grow"></div>
    <button type="button" class="out" id="liveBtn"></button>
    <button type="button" class="out" id="recBtn"></button>
    <button type="button" class="safeBtn" id="safeBtn" aria-pressed="false" aria-label="Safe mode"></button>
    <button type="button" class="menuBtn" id="menuBtn" aria-expanded="false" aria-controls="menu">Menu<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
  </header>

  <nav class="menu" id="menu" aria-label="Menu" hidden>
    <button type="button" data-m="slides"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h20"></path><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"></path><path d="m7 21 5-5 5 5"></path></svg>Slideshow<span id="mSlides">Off</span></button>
    <button type="button" data-m="ready"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg>Ready check</button>
    <button type="button" data-m="phone"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"></rect><path d="M12 18h.01"></path></svg>Phone remote</button>
    <button type="button" data-m="coll"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg>Scene collection<span id="mColl"></span></button>
    <hr>
    <button type="button" data-m="settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Settings</button>
    <button type="button" data-m="full"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>Full controller<span>on this screen</span></button>
  </nav>

  <div class="main">
    <div class="left">
      <div class="mon"><img id="pgm" alt="" hidden><span class="wait" id="pgmWait">Waiting for a picture from OBS…</span><span class="tag" id="pgmTag">PROGRAM</span></div>
      <button type="button" class="mic" id="mic" aria-pressed="false">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" id="micIco"></svg>
        <span class="meter"><i id="lvl"></i></span>
        <b id="micTxt"></b>
      </button>
      <div class="notes" id="notes"></div>
    </div>
    <div class="right">
      <div class="tiles" id="tiles"></div>
      <div class="nowbar" id="nowbar"></div>
      <div class="ons" id="ons"></div>
    </div>
  </div>

  <div id="layer"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div></div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const api = window.bghSimple || null;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const ICON = {
  mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  micOff:'<line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7 7 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>',
  back:'<path d="m15 18-6-6 6-6"/>', fwd:'<path d="m9 18 6-6-6-6"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  list:'<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  stop:'<rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor" stroke="none"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  slides:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>'
};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n] || ""}</svg>`;
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, "0")).join(":"); };
const secTxt = s => s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s} s`;
const durTxt = s => s >= 60 && s % 60 === 0 ? `${s / 60} min` : `${s} s`;
// Only touch what changed, so a tap in progress isn't lost to a redraw
const setHTML = (el, html) => { if(el._h !== html){ el._h = html; el.innerHTML = html; } };

const S = {st:null, stAt:0, level:0, frame:"", pending:null, pendingT:null};

/* ---------------- talking to the controller */
async function cmd(c, args = {}){
  if(!api) return {ok:false, error:"Simple mode only works inside the BGH LIVE Controller app."};
  try{ return await api.cmd(c, args); }catch(e){ return {ok:false, error:"The controller didn't answer. Try again."}; }
}
// Anything that changes the stream: in Safe mode Simple mode asks first, as the controller does
async function act(c, args, ask){
  if(!ask) args = {...args, sure:true};
  else if(S.st && S.st.safe){
    if(!await confirmSheet("Safe mode is on", `${ask}`, "Yes, do it")) return {ok:false};
    args = {...args, sure:true};
  }
  const j = await cmd(c, args);
  if(!j.ok && j.error) toast(j.error);
  return j;
}

/* ---------------- drawing */
function render(){
  const st = S.st;
  if(!st){ $("coll").textContent = "Waiting for the controller…"; return; }
  const ok = st.obs;
  $("coll").textContent = ok ? st.collection : "Not connected to OBS";
  $("coll").className = "coll" + (ok ? "" : " bad");
  $("mColl").textContent = st.collection || "";
  $("mSlides").textContent = st.slides && st.slides.on ? "On" : "Off";

  const lb = $("liveBtn"), rb = $("recBtn");
  const lc = st.live ? "live" : st.pending ? "wait" : "go";
  if(lb.className !== "out " + lc || lb._live !== st.liveT0){
    lb.className = "out " + lc; lb._live = st.liveT0;
    lb.innerHTML = st.live ? `<i class="dot"></i><span id="lt">LIVE ${fmt(Date.now() - st.liveT0)}</span><span class="cap">${ic("stop")}END</span>`
      : st.pending ? `<i class="dot"></i>STARTING…` : `<i class="dot"></i>GO LIVE`;
  }
  lb.setAttribute("aria-label", st.live ? "Live. Tap to end the livestream" : st.pending ? "Waiting for OBS to start the stream" : "Go live: opens Go Live on this screen");
  const rc = st.rec ? "rec" : st.live ? "remind" : "";
  if(rb.className !== "out " + rc || rb._rec !== st.recT0){
    rb.className = "out " + rc; rb._rec = st.recT0;
    rb.innerHTML = st.rec ? `<i class="dot"></i><span id="rt">REC ${fmt(Date.now() - st.recT0)}</span><span class="cap">${ic("stop")}STOP</span>` : `<i class="dot"></i>${st.live ? "NOT RECORDING" : "RECORD"}`;
  }
  rb.setAttribute("aria-label", st.rec ? "Recording. Tap to stop" : "Start recording");
  const sb = $("safeBtn");
  sb.setAttribute("aria-pressed", String(!!st.safe));
  sb.title = st.safe ? "Safe mode is on: every change asks first. Tap to turn it off." : "Safe mode is off. Tap to turn it on.";
  setHTML(sb, `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="${st.safe ? "M7 11V7a5 5 0 0 1 10 0v4" : "M7 11V7a5 5 0 0 1 9.9-1"}"></path></svg>`);

  const a = st.audio || {}, micOk = !!a.name && !a.missing;
  $("mic").disabled = !micOk;
  $("mic").setAttribute("aria-pressed", String(!!a.muted));
  setHTML($("micIco"), a.muted || !micOk ? ICON.micOff : ICON.mic);
  $("micTxt").textContent = !micOk ? "NO MIC SET UP" : a.muted ? "MUTED · tap for mic" : "MIC ON · tap to mute";
  if(a.muted || !micOk) $("lvl").style.width = "0%";

  const tag = `PROGRAM · ${String(st.program || "").toUpperCase()}`;
  if($("pgmTag").textContent !== tag) $("pgmTag").textContent = tag;

  const list = st.scenes || [];
  setHTML($("tiles"), list.map(tileHTML).join(""));
  $("tiles").style.gridTemplateRows = `repeat(${Math.max(1, Math.ceil(list.length / 2))},minmax(0,1fr))`;
  renderOns(st);
  renderNotes(st);
}
function tileHTML(s){
  const st = S.st, ae = st.autoEnd || {};
  let sub = s.on ? "ON AIR" : s.sub ? esc(s.sub) : "";
  if(s.ending && ae.on){
    if(s.on && ae.kept) sub = "ON AIR · staying live";
    else if(s.on && ae.left != null) sub = `ON AIR · ends in ${secTxt(endLeft())} · tap to cancel`;
    else if(!s.on) sub = `Ends the stream after ${durTxt(ae.sec)}`;
  }
  const mic = s.mic === "off" ? ic("micOff", "i mi off") : s.mic === "on" ? ic("mic", "i mi") : "";
  const pend = S.pending === s.label && !s.on;
  return `<button type="button" class="tile${pend ? " pending" : ""}" data-sc="${esc(s.label)}" aria-pressed="${!!s.on}"><span class="nm">${esc(s.label)}</span>${sub ? `<small>${sub}</small>` : ""}${mic}</button>`;
}
function endLeft(){ const ae = S.st.autoEnd; return Math.max(0, ae.left - Math.floor((Date.now() - S.stAt) / 1000)); }
function renderOns(st){
  const it = st.item, up = st.ltUp;
  let nb = "", ons = "";
  if(!st.ltOn){
    ons = `<span class="off">Hymns, Bible and names are off for ${esc(st.collection)}. Turn them on in Settings → Scene collections.</span>`;
  } else if(it && it.kind === "hymn"){
    const sub = it.intro ? "number on screen · Next brings in the words" : `${esc(it.label)}${it.pages > 1 ? ` (${it.page} of ${it.pages})` : ""}${it.part === "chorus" && /^verse /i.test(it.label) ? " · Chorus" : it.part === "final" ? " · Final chorus" : ""} · ${it.i + 1} of ${it.n}`;
    nb = `<span class="up${it.showing ? "" : " off"}">${it.showing ? "ON SCREEN" : "HIDDEN"}</span><b>${esc(it.title)}</b> · ${sub}`;
    ons = `<button type="button" data-o="back" ${it.i ? "" : "disabled"}>${ic("back")}Back</button>
      <button type="button" class="next" data-o="next" ${it.next ? "" : "disabled"}>Next${ic("fwd")}</button>
      ${it.labels && it.labels.length > 1 ? `<button type="button" data-o="verses">${ic("list")}Verses</button>` : ""}
      <button type="button" class="done" data-o="done">${ic("check")}Done</button>`;
  } else if(it){
    nb = `<span class="up${it.showing ? "" : " off"}">${it.showing ? "ON SCREEN" : it.started ? "HIDDEN" : "READY"}</span><b>${esc(it.started ? it.ref : it.title)}</b>${it.started ? "" : " · tap Start, or Verses to pick where to start"}`;
    ons = `<button type="button" data-o="back" ${it.started && it.i ? "" : "disabled"}>${ic("back")}Back</button>
      <button type="button" class="next" data-o="next" ${!it.started || it.i < it.verses.length - 1 ? "" : "disabled"}>${it.started ? "Next" : "Start"}${ic("fwd")}</button>
      <button type="button" data-o="verses">${ic("list")}Verses</button>
      <button type="button" class="done" data-o="done">${ic("check")}Done</button>`;
  } else {
    if(up){
      const left = st.ltEnds ? Math.max(0, Math.ceil((st.ltEnds - Date.now()) / 1000)) : 0;
      nb = `<span class="up">ON SCREEN</span><b>${esc(up.name)}</b>${up.sub ? ` · ${esc(up.sub)}` : ""}${left ? ` · hides in ${left} s` : ""}`;
    }
    ons = `<button type="button" data-o="hymn" ${up ? "disabled" : ""}>${ic("music")}Hymn</button>
      <button type="button" data-o="bible" ${up ? "disabled" : ""}>${ic("book")}Bible</button>
      <button type="button" data-o="names">${ic("user")}Names</button>`;
  }
  setHTML($("nowbar"), nb);
  setHTML($("ons"), ons);
  if(S.sheetFor === "verses" && S.drawVerses) S.drawVerses();
  if(S.sheetFor === "names" && S.drawNames) S.drawNames();
}
function renderNotes(st){
  const out = [];
  if(!st.obs) out.push(`<div class="bn bad">${ic("alert")}<span class="t"><b>The controller can't reach OBS.</b> Check OBS is open on the main monitor.</span></div>`);
  if(st.ytStart) out.push(`<div class="bn bad">${ic("alert")}<span class="t"><b>Viewers can't see the stream yet.</b> ${st.ytStart === "waiting" ? "YouTube isn't receiving the video yet." : "This broadcast doesn't start by itself."}</span><button type="button" class="btn danger" data-n="yt">Start broadcast</button></div>`);
  if(st.health && st.health.alert) out.push(`<div class="bn bad">${ic("alert")}<span class="t"><b>Stream trouble.</b> ${esc(st.health.alert)}</span></div>`);
  if(st.battery) out.push(`<div class="bn${st.battery.low ? " bad" : " warn"}">${ic("info")}<span class="t"><b>The laptop is on battery (${st.battery.pct}%).</b> Plug in its charger.</span></div>`);
  const g = st.slides;
  if(g && g.on && g.src === "laptop" && g.live){
    if(!g.open) out.push(`<div class="bn warn">${ic("slides")}<span class="t"><b>The slideshow isn't open.</b></span><button type="button" class="btn primary" data-n="ss-open">Open the slideshow</button></div>`);
    else out.push(`<div class="ssbar"><button type="button" class="btn" data-n="ss-back" aria-label="Previous slide" ${g.n <= 1 ? "disabled" : ""}>${ic("back")}</button>
      <div class="mid">${S.slideImg ? `<img src="${S.slideImg}" alt="">` : ic("slides")}<b>${g.total ? `Slide ${g.n} of ${g.total}` : `Slide ${g.n}`}</b><span>${esc(g.title || "")}</span></div>
      <button type="button" class="btn primary" data-n="ss-next" aria-label="Next slide" ${g.total && g.n >= g.total ? "disabled" : ""}>${ic("fwd")}</button></div>`);
  }
  setHTML($("notes"), out.join(""));
}

/* ---------------- sheets */
function sheet(html, wire, opts = {}){
  $("layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet${opts.wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  $("scrim").addEventListener("click", e => { if(e.target.id === "scrim"){ close(); if(opts.onCancel) opts.onCancel(); } });
  S.sheetFor = opts.kind || "";
  wire && wire();
}
function close(){ $("layer").innerHTML = ""; S.sheetFor = ""; S.drawVerses = S.drawNames = null; }
function confirmSheet(title, body, ok, danger){
  return new Promise(res => sheet(`<h2>${esc(title)}</h2><p>${esc(body)}</p><div class="row2"><button type="button" class="btn" id="no">Cancel</button><button type="button" class="btn ${danger ? "danger" : "primary"}" id="yes">${esc(ok)}</button></div>`,
    () => { $("no").onclick = () => { close(); res(false); }; $("yes").onclick = () => { close(); res(true); }; }, {onCancel:() => res(false)}));
}
let toastT;
function toast(m){ const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600 + Math.max(0, m.length - 60) * 40); }

function openHymn(){
  const st = S.st; if(!st.books || !st.books.length) return toast("There are no hymn books yet. Add one in Settings → On-screen text.");
  let book = st.books.some(b => b.id === st.book) ? st.book : st.books[0].id, num = "", found = null, t = null;
  const bookName = () => (st.books.find(b => b.id === book) || {}).name || "this book";
  const draw = () => {
    const el = $("hNum"); if(!el) return;
    el.innerHTML = !num ? `<span style="margin:0">Hymn number</span>` : `${esc(num)}${found ? `<span>${esc(found.title)} · ${found.verses} verse${found.verses === 1 ? "" : "s"}</span>` : found === false ? `<span class="err">No hymn ${esc(num)} in ${esc(bookName())}</span>` : `<span>Looking…</span>`}`;
    $("hGo").disabled = !found;
  };
  const look = () => {
    clearTimeout(t); found = null; draw();
    if(!num) return;
    const n = num;
    t = setTimeout(async () => {
      const j = await cmd("hymn-find", {book, num:n});
      if(n !== num || !$("hNum")) return;
      found = j.ok && j.data ? j.data : false; draw();
    }, 200);
  };
  sheet(`<h2>Hymn</h2>${st.books.length > 1 ? `<div class="chips" id="hBooks">${st.books.map(b => `<button type="button" data-b="${esc(b.id)}" aria-pressed="${b.id === book}">${esc(b.short || b.name)}</button>`).join("")}</div>` : `<p>${esc(st.books[0].name)}</p>`}
    <div class="num" id="hNum"></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k => `<button type="button" data-k="${k}">${k}</button>`).join("")}<button type="button" data-k="c">Clear</button><button type="button" data-k="0">0</button><button type="button" data-k="x" aria-label="Delete">⌫</button></div>
    <div class="row2"><button type="button" class="btn" id="hNo">Cancel</button><button type="button" class="btn primary" id="hGo" disabled>Put it up</button></div>`, () => {
    document.querySelectorAll("#hBooks [data-b]").forEach(b => b.onclick = () => { book = b.dataset.b; document.querySelectorAll("#hBooks [data-b]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); look(); });
    document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; num = k === "c" ? "" : k === "x" ? num.slice(0, -1) : (num + k).slice(0, 4); look(); });
    $("hNo").onclick = close;
    $("hGo").onclick = async () => { const n = num; close(); await act("hymn", {book, num:n}, `Show hymn ${n} on the stream?`); };
    draw();
  }, {kind:"hymn"});
}

  ["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],
  ["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],
  ["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],
  ["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],
  ["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],
  ["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],
  ["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
async function openBible(){
  const st = S.st;
  let tr = st.tr || "KJV", trs = [{abbr:tr, ok:true}], testament = "nt", book = null;
  const j = await cmd("bible-status"); if(j.ok && Array.isArray(j.data)) trs = j.data;
  if(!trs.some(x => x.abbr === tr && x.ok)) tr = (trs.find(x => x.ok) || {abbr:"KJV"}).abbr;
  const open = async ref => { close(); await act("bible", {ref, tr}, `Open ${ref} (${tr})?`); };
  const draw = () => {
    const el = $("bPick"); if(!el) return;
    const list = testament === "ot" ? BOOKS.slice(0, 39) : BOOKS.slice(39);
    el.innerHTML = book
      ? `<div class="pickh"><button type="button" class="link" id="bBack">${ic("back")}Books</button><b>${esc(book[0])}</b><span>Choose a chapter</span></div>
         <div class="grid nums">${Array.from({length:book[1]}, (_, i) => `<button type="button" data-ch="${i + 1}">${i + 1}</button>`).join("")}</div>`
      : `<div class="seg" role="tablist" aria-label="Testament"><button type="button" role="tab" data-tm="ot" aria-selected="${testament === "ot"}">Old Testament</button><button type="button" role="tab" data-tm="nt" aria-selected="${testament === "nt"}">New Testament</button></div>
         <div class="grid books">${list.map(b => `<button type="button" data-bk="${esc(b[0])}">${esc(b[0])}</button>`).join("")}</div>`;
    el.querySelectorAll("[data-tm]").forEach(b => b.onclick = () => { testament = b.dataset.tm; draw(); });
    el.querySelectorAll("[data-bk]").forEach(b => b.onclick = () => { const bk = BOOKS.find(x => x[0] === b.dataset.bk); if(bk[1] === 1) return open(bk[0]); book = bk; draw(); });
    el.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => open(`${book[0]} ${b.dataset.ch}`));
    if($("bBack")) $("bBack").onclick = () => { book = null; draw(); };
  };
  sheet(`<h2>Bible</h2>
    <div class="chips" id="bTr">${trs.map(x => `<button type="button" data-t="${esc(x.abbr)}" aria-pressed="${x.abbr === tr}" ${x.ok ? "" : "disabled"}>${esc(x.abbr)}</button>`).join("")}</div>
    ${st.reading ? `<button type="button" class="reading" id="bRead">${ic("book")}<span>Open ${esc(st.reading)}<small>Today's Bible Reading</small></span></button>` : ""}
    <div id="bPick" style="display:flex;flex-direction:column;gap:16px"></div>
    <div class="row2"><button type="button" class="btn" id="bNo">Cancel</button><span></span></div>`, () => {
    document.querySelectorAll("#bTr [data-t]").forEach(b => b.onclick = () => { tr = b.dataset.t; document.querySelectorAll("#bTr [data-t]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    if($("bRead")) $("bRead").onclick = () => open(st.reading);
    $("bNo").onclick = close;
    draw();
  }, {wide:true, kind:"bible"});
}
function openVerses(){
  sheet(`<h2 id="vH"></h2><div class="chips scroll" id="vList"></div><div class="row2"><button type="button" class="btn" id="vNo">Close</button><span></span></div>`, () => {
    $("vNo").onclick = close;
    S.drawVerses = () => {
      const it = S.st && S.st.item; if(!it) return close();
      if(it.kind === "hymn"){
        $("vH").textContent = `${it.title}: go to`;
        setHTML($("vList"), it.labels.map(l => `<button type="button" data-jl="${esc(l)}" aria-pressed="${!it.intro && l === it.label}">${esc(l)}</button>`).join(""));
      } else {
        const seen = new Set(it.seen || []);
        $("vH").textContent = `${it.title}: tap the verse being read`;
        setHTML($("vList"), it.verses.map((v, i) => `<button type="button" data-vi="${i}" class="${seen.has(i) && i !== it.i ? "seen" : ""}" aria-pressed="${!!it.started && i === it.i}">${v}</button>`).join(""));
      }
    };
    $("vList").addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.jl) cmd("jump", {label:b.dataset.jl}).then(j => !j.ok && j.error && toast(j.error));
      else cmd("verse", {i:+b.dataset.vi}).then(j => { if(j.ok) close(); else if(j.error) toast(j.error); });
    });
    S.drawVerses();
  }, {wide:true, kind:"verses"});
}
function openNames(){
  sheet(`<h2>Names</h2><p id="nP"></p><div class="chips" id="nList"></div><div class="row2"><button type="button" class="btn" id="nNo">Close</button><span></span></div>`, () => {
    $("nNo").onclick = close;
    S.drawNames = () => {
      const st = S.st; if(!st) return;
      $("nP").textContent = st.lts.length ? `Tap a name to show it. It hides itself after ${st.ltDur || 8} seconds. Tap it again to take it off.` : "No speakers yet. Choose them in Go Live, or in Change speaker on the full controller.";
      setHTML($("nList"), st.lts.map((l, i) => { const up = !!st.ltUp && st.ltUp.name === l.name && st.ltUp.sub === l.sub;
        return `<button type="button" data-ln="${i}" class="${up ? "up" : ""}">${esc(l.short || l.name)}${l.note ? `<small>${esc(l.note)}</small>` : ""}</button>`; }).join(""));
    };
    $("nList").addEventListener("click", async e => {
      const b = e.target.closest("[data-ln]"); if(!b) return;
      const st = S.st, l = st.lts[+b.dataset.ln]; if(!l) return;
      const up = !!st.ltUp && st.ltUp.name === l.name && st.ltUp.sub === l.sub;
      if(!up) close();
      await act("lt", {name:l.name, sub:l.sub}, up ? null : `Show ${l.name}'s name on the stream?`);
    });
    S.drawNames();
  }, {kind:"names"});
}

/* ---------------- taps */
$("tiles").addEventListener("click", async e => {
  const b = e.target.closest("[data-sc]"); if(!b || !S.st) return;
  const n = b.dataset.sc, s = S.st.scenes.find(x => x.label === n); if(!s) return;
  if(s.on){
    // Ending, live and counting down: tapping it again keeps Ending on but cancels the timer
    const ae = S.st.autoEnd;
    if(s.ending && ae.on && ae.left != null && !ae.kept){ const j = await cmd("keep"); if(j.ok) toast("Timer cancelled. The stream stays live."); else if(j.error) toast(j.error); }
    return;
  }
  if(S.st.safe && !await confirmSheet("Safe mode is on", `Switch the livestream to ${n}?`, "Switch")) return;
  clearTimeout(S.pendingT); S.pending = n; render();
  S.pendingT = setTimeout(() => { if(S.pending === n){ S.pending = null; render(); } }, 4000);
  const j = await cmd("scene", {label:n, sure:true});
  S.pending = null; clearTimeout(S.pendingT);
  if(!j.ok && j.error) toast(j.error);
  render();
});
$("ons").addEventListener("click", e => {
  const b = e.target.closest("[data-o]"); if(!b || b.disabled) return;
  const o = b.dataset.o, say = j => !j.ok && j.error && toast(j.error);
  if(o === "hymn") openHymn();
  else if(o === "bible") openBible();
  else if(o === "names") openNames();
  else if(o === "verses") openVerses();
  else if(o === "next") cmd("step", {d:1}).then(say);
  else if(o === "back") cmd("step", {d:-1}).then(say);
  else if(o === "done") cmd("done").then(say);
});
$("notes").addEventListener("click", async e => {
  const b = e.target.closest("[data-n]"); if(!b || b.disabled) return;
  const n = b.dataset.n, say = j => !j.ok && j.error && toast(j.error);
  if(n === "yt"){ const j = await cmd("yt-start"); toast(j.ok ? "Starting the YouTube broadcast…" : j.error || "Couldn't start it. Press Start Broadcast in OBS."); }
  else if(n === "ss-open") cmd("slide-open").then(say);
  else if(n === "ss-back") cmd("slide", {d:-1}).then(say);
  else if(n === "ss-next") cmd("slide", {d:1}).then(say);
});
$("mic").onclick = () => { const a = S.st && S.st.audio; if(!a || !a.name || a.missing) return; const m = !a.muted; act("mute", {muted:m}, m ? null : "Unmute the mic?"); };
$("safeBtn").onclick = async () => { if(!S.st) return; const j = await cmd("safe", {on:!S.st.safe}); if(j.ok) toast(!S.st.safe ? "Safe mode on: every change asks first." : "Safe mode off."); else if(j.error) toast(j.error); };
$("liveBtn").onclick = async () => {
  const st = S.st; if(!st) return;
  if(st.live){
    if(!await confirmSheet("End the livestream?", `You have been live for ${fmt(Date.now() - st.liveT0)}. Viewers will see the stream end. Recording keeps going if it's on.`, "End livestream", true)) return;
    const j = await cmd("stream-stop"); if(!j.ok && j.error) toast(j.error);
    return;
  }
  // Go Live, the waiting message and signing in all happen in the full controller, brought onto this screen
  const j = await cmd("go-live"); if(!j.ok && j.error) toast(j.error);
};
$("recBtn").onclick = async () => {
  const st = S.st; if(!st) return;
  if(st.rec){
    if(!await confirmSheet("Stop recording?", `The recording has been running for ${fmt(Date.now() - st.recT0)}. Stopping finalizes the file.`, "Stop recording", true)) return;
    const j = await cmd("rec-stop"); if(!j.ok && j.error) toast(j.error);
    return;
  }
  let j = await cmd("rec-start");
  if(!j.ok && j.code === "LOW_DISK"){
    if(!await confirmSheet("Low disk space", j.error, "Record anyway")) return;
    j = await cmd("rec-start", {force:true});
  }
  if(!j.ok && j.error) toast(j.error);
};
const menuOpen = open => { $("menu").hidden = !open; $("menuBtn").setAttribute("aria-expanded", String(open)); };
$("menuBtn").onclick = () => menuOpen($("menu").hidden);
$("menu").addEventListener("click", async e => {
  const b = e.target.closest("[data-m]"); if(!b) return;
  menuOpen(false);
  // Everything in the menu opens in the full controller, brought onto this screen until it's closed
  const j = await cmd("open", {what:b.dataset.m}); if(!j.ok && j.error) toast(j.error);
});
document.addEventListener("click", e => { if(!$("menu").hidden && !e.target.closest("#menu,#menuBtn")) menuOpen(false); });
// No long-press menus, no text selection, no zooming with two fingers on the touchscreen
document.addEventListener("contextmenu", e => e.preventDefault());

/* ---------------- what the controller sends */
function onState(s){
  if(!s) return;
  S.st = s; S.stAt = Date.now();
  if(S.pending && s.scenes && s.scenes.some(x => x.label === S.pending && x.on)){ S.pending = null; clearTimeout(S.pendingT); }
  render();
}
function onFrame(f){
  if(!f || f === S.frame) return;
  S.frame = f; const img = $("pgm"); img.src = f; img.hidden = false; $("pgmWait").hidden = true;
}
if(api){
  api.onState(onState);
  api.onFrame(onFrame);
  api.onLevel(l => { S.level = l; const a = S.st && S.st.audio; $("lvl").style.width = (a && (a.muted || !a.name || a.missing) ? 0 : l) + "%"; });
  api.onToast(t => t && toast(t));
  api.hello().then(h => { if(h){ if(h.frame) onFrame(h.frame); if(h.state) onState(h.state); } }).catch(() => {});
}

/* ---------------- clocks */
setInterval(() => {
  const st = S.st; if(!st) return;
  if(st.live && $("lt")) $("lt").textContent = "LIVE " + fmt(Date.now() - st.liveT0);
  if(st.rec && $("rt")) $("rt").textContent = "REC " + fmt(Date.now() - st.recT0);
}, 500);

/* ---------------- fit the 1920×1080 layout to the touchscreen */
function fit(){
  const w = window.innerWidth, h = window.innerHeight, k = Math.min(w / 1920, h / 1080);
  $("stage").style.transform = `scale(${k})`;
  $("frame").style.width = 1920 * k + "px"; $("frame").style.height = 1080 * k + "px";
}
window.addEventListener("resize", fit);
fit(); render();
</script>
</body>
